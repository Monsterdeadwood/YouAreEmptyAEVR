name: VR feedback
description: "Report a reproducible issue with You Are Empty: Absolute Edition VR"
title: "[VR] "
body:
  - type: markdown
    attributes:
      value: "Testing and discussion take place in the [Flat2VR Discord](https://discord.gg/P4q9zt7ek). Please include the same build details when posting there."
  - type: input
    id: version
    attributes:
      label: Mod version and game build
      description: Include the mod package name and your store or executable version.
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Headset, OpenXR runtime and GPU
      placeholder: "Headset / runtime / GPU"
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened, and how to reproduce it
      description: Include the mission or map, weapon or item, expected behavior and actual behavior.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Diagnostic ZIP, screenshots or video
      description: Attach the support archive generated by the test package, if available.
